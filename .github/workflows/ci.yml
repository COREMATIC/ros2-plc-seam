name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
          colcon test --packages-select plc_seam
          colcon test-result --verbose

  pixi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs pixi and the locked environment, cached on pixi.lock.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - name: Build and test
        run: pixi run test
